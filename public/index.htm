<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function() {
      try {
        var lastRoute = localStorage.getItem('wedding_invitation_route');
        if (lastRoute === '/c' || lastRoute === '/h') {
          window.location.replace(lastRoute + (window.location.search || '') + (window.location.hash || ''));
          return;
        }
      } catch (e) {}
      window.location.replace('/');
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/">
  <link rel="canonical" href="https://ivefoundher.fyi/">
  <title>Redirecting...</title>
</head>
<body>
  <p>Redirecting to <a href="/">home</a>...</p>
</body>
</html>
