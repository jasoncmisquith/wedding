<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function() {
      try {
        var lastRoute = localStorage.getItem('wedding_invitation_route');
        if (lastRoute === '/c' || lastRoute === '/h') {
          window.location.replace(lastRoute + (window.location.search || '') + (window.location.hash || ''));
        }
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Nothing Here</title>
  <link rel="icon" type="image/png" href="assets/ring-icon.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b0c0e;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      max-width: 440px;
      width: 100%;
      padding: 2.75rem 2rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
    }
    .badge {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 600;
      color: #d4af37;
      margin-bottom: 1.25rem;
      padding: 0.35rem 0.85rem;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 9999px;
      background: rgba(212, 175, 55, 0.08);
    }
    h1 {
      font-size: 1.85rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
      color: #ffffff;
    }
    p {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #9ca3af;
      margin-bottom: 0.75rem;
    }
    .hint {
      font-size: 0.8rem;
      color: #6b7280;
      margin-top: 1.5rem;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Private Link</div>
    <h1>Nothing Here</h1>
    <p>This root address does not host any public content.</p>
    <p>Please check the personalized link you received to access your invitation.</p>
    <div class="hint">ivefoundher.fyi</div>
  </main>
</body>
</html>
